<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mpThree – YouTube MP3 Downloader</title>
    <meta name="description" content="YouTube videolarını yüksek kaliteli MP3'e dönüştürün. Hızlı, ücretsiz ve Dockerize edilmiş.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #0066cc;
            --blue-hover: #0077ed;
            --border: #d2d2d7;
            --text: #1d1d1f;
            --secondary: #6e6e73;
            --bg: #f5f5f7;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .card {
            background: #fff;
            padding: 44px 36px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            text-align: center;
        }

        .logo { font-size: 44px; margin-bottom: 20px; display: inline-block; }

        h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--secondary);
            margin-bottom: 36px;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            margin-bottom: 14px;
        }

        input[type="text"]:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(0,102,204,0.12);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--blue);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover:not(:disabled) { background: var(--blue-hover); }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled { background: #e5e5ea; color: #aeaeb2; cursor: not-allowed; }

        /* Progress */
        #progressArea {
            display: none;
            margin-top: 28px;
            text-align: left;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status-text {
            font-size: 11px;
            font-weight: 600;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .percent-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--blue);
        }

        .track-bg {
            width: 100%;
            height: 4px;
            background: #e5e5ea;
            border-radius: 2px;
            overflow: hidden;
        }

        .track-fill {
            height: 100%;
            width: 0%;
            background: var(--blue);
            border-radius: 2px;
            transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
        }

        /* Messages */
        .msg {
            display: none;
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            text-align: left;
        }

        .msg-success {
            background: #f0faf0;
            color: #1a7f3a;
            border: 1px solid #b6e9c6;
        }

        .msg-error {
            background: #fff0f0;
            border: 1px solid #ffd1d1;
            color: #d93025;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">🎵</div>
            <h1>mpThree</h1>
            <p class="subtitle">YouTube videolarını yüksek kalitede MP3'e dönüştürün.</p>

            <form id="downloadForm">
                <input type="text" id="urlInput" placeholder="YouTube bağlantısını yapıştırın…" required autocomplete="off">
                <button type="submit" id="downloadBtn">İndir</button>
            </form>

            <div id="progressArea">
                <div class="status-row">
                    <span class="status-text" id="statusLabel">BEKLENIYOR</span>
                    <span class="percent-text" id="percentLabel">0%</span>
                </div>
                <div class="track-bg">
                    <div class="track-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="msg msg-success" id="successMsg">✅ İndirme tamamlandı, dosya kaydediliyor…</div>
            <div class="msg msg-error" id="errorMsg"></div>
        </div>
    </div>

    <script>
        const form        = document.getElementById('downloadForm');
        const urlInput    = document.getElementById('urlInput');
        const btn         = document.getElementById('downloadBtn');
        const progressArea = document.getElementById('progressArea');
        const statusLabel = document.getElementById('statusLabel');
        const percentLabel = document.getElementById('percentLabel');
        const progressBar = document.getElementById('progressBar');
        const successMsg  = document.getElementById('successMsg');
        const errorMsg    = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;

            hideMessages();
            setLoading(true);

            try {
                const res = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `url=${encodeURIComponent(url)}`
                });
                const data = await res.json();
                if (data.job_id) {
                    trackJob(data.job_id);
                } else {
                    showError(data.error || 'İndirme başlatılamadı.');
                    setLoading(false);
                }
            } catch {
                showError('Sunucuya bağlanılamadı.');
                setLoading(false);
            }
        });

        function trackJob(jobId) {
            progressArea.style.display = 'block';
            const es = new EventSource(`/progress/${jobId}`);

            es.onmessage = (e) => {
                const d = JSON.parse(e.data);
                statusLabel.textContent = d.status.toUpperCase();
                const pct = Math.min(Math.round(d.progress), 100);
                percentLabel.textContent = pct + '%';
                progressBar.style.width = pct + '%';

                if (d.completed) {
                    es.close();
                    successMsg.style.display = 'block';
                    urlInput.value = '';
                    // Trigger file download
                    window.location.href = `/get-file/${jobId}`;
                    setTimeout(resetUI, 5000);
                }

                if (d.error) {
                    es.close();
                    showError(d.status);
                    setLoading(false);
                    progressArea.style.display = 'none';
                }
            };

            es.onerror = () => {
                es.close();
                showError('Bağlantı kesildi. Lütfen tekrar deneyin.');
                setLoading(false);
                progressArea.style.display = 'none';
            };
        }

        function setLoading(on) {
            btn.disabled = on;
            btn.textContent = on ? 'İndiriliyor…' : 'İndir';
        }

        function showError(msg) {
            errorMsg.textContent = '⚠️ ' + msg;
            errorMsg.style.display = 'block';
        }

        function hideMessages() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        function resetUI() {
            setLoading(false);
            progressArea.style.display = 'none';
            successMsg.style.display = 'none';
            progressBar.style.width = '0%';
            percentLabel.textContent = '0%';
            statusLabel.textContent = 'BEKLENIYOR';
        }
    </script>
</body>
</html>
