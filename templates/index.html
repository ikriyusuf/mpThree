<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mpThree - YouTube Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --apple-blue: #0066cc;
            --apple-blue-hover: #0077ed;
            --apple-border: #d2d2d7;
            --apple-text: #1d1d1f;
            --apple-secondary: #6e6e73;
            --apple-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--apple-bg);
            color: var(--apple-text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #fff;
            padding: 40px 32px;
            /* Apple ID style: simple, no heavy shadow, clean border or very light shadow */
            border: 1px solid #f2f2f2;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        .logo {
            font-size: 42px;
            margin-bottom: 24px;
            display: inline-block;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.015em;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: var(--apple-secondary);
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .input-wrapper {
            margin-bottom: 16px;
            text-align: left;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            background-color: #ffffff;
            border: 1px solid var(--apple-border);
            border-radius: 10px;
            font-size: 16px;
            color: var(--apple-text);
            outline: none;
            transition: border-color 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus {
            border-color: var(--apple-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 204, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--apple-blue);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--apple-blue-hover);
        }

        button:disabled {
            background-color: #e5e5ea;
            color: #aeaeaf;
            cursor: not-allowed;
        }

        #progressArea {
            display: none;
            margin-top: 32px;
            text-align: left;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .status-text {
            font-size: 12px;
            font-weight: 600;
            color: var(--apple-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .percent-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--apple-blue);
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: #f2f2f7;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--apple-blue);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .success-msg {
            display: none;
            margin-top: 24px;
            padding: 12px;
            background: #f5f5f7;
            border-radius: 10px;
            color: var(--apple-text);
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">🎵</div>
            <h1>mpThree</h1>
            <p>Favori videolarınızı yüksek kaliteli ses dosyalarına dönüştürün.</p>
            
            <form id="downloadForm">
                <div class="input-wrapper">
                    <input type="text" id="url" placeholder="YouTube bağlantısı" required>
                </div>
                <button type="submit" id="downloadBtn">İndir</button>
            </form>

            <div id="progressArea">
                <div class="status-header">
                    <span class="status-text" id="statusLabel">BEKLENİYOR</span>
                    <span class="percent-text" id="percentLabel">0%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
            </div>

            <div class="success-msg" id="successMsg">
                Dosya hazırlanıyor, lütfen bekleyin...
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const urlInput = document.getElementById('url');
        const btn = document.getElementById('downloadBtn');
        const progressArea = document.getElementById('progressArea');
        const statusLabel = document.getElementById('statusLabel');
        const percentLabel = document.getElementById('percentLabel');
        const progressBar = document.getElementById('progressBar');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value;
            btn.disabled = true;
            btn.textContent = 'Başlatılıyor';
            
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `url=${encodeURIComponent(url)}`
                });
                const data = await response.json();
                if (data.job_id) startTracking(data.job_id);
                else { alert('Hata: ' + data.error); resetUI(); }
            } catch (err) { alert('Bağlantı hatası.'); resetUI(); }
        });

        function startTracking(jobId) {
            progressArea.style.display = 'block';
            successMsg.style.display = 'none';
            const eventSource = new EventSource(`/progress/${jobId}`);
            
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                statusLabel.textContent = data.status;
                percentLabel.textContent = Math.round(data.progress) + '%';
                progressBar.style.width = data.progress + '%';
                
                if (data.completed) {
                    eventSource.close();
                    successMsg.style.display = 'block';
                    urlInput.value = '';
                    window.location.href = `/get-file/${jobId}`;
                    setTimeout(resetUI, 4000);
                }
                if (data.error) { eventSource.close(); alert(data.status); resetUI(); }
            };
        }

        function resetUI() {
            btn.disabled = false;
            btn.textContent = 'İndir';
            progressArea.style.display = 'none';
            successMsg.style.display = 'none';
        }
    </script>
</body>
</html>
