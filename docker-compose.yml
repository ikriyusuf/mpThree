services:
  mpthree:
    build: .
    container_name: mpthree-app
    ports:
      - "1966:1966"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1966')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
